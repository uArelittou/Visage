<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千面录</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* 注册成颜色类型，主题色换卡时才能平滑过渡，不会一跳一跳 */
@property --theme{syntax:'<color>';inherits:true;initial-value:#a68cff}
@property --theme-deep{syntax:'<color>';inherits:true;initial-value:#4b3391}
:root{
  --bg:#0b0d13;
  --bg-up:#121620;
  --panel:#0d1016;
  --theme:#a68cff;
  --theme-deep:#4b3391;
  --text:#c9d2dd;
  --dim:#7d8898;
  --line:rgba(201,210,221,.12);
  --silver:#e9edf2;
  --wine:#4b3391;
  --rose:#a68cff;
  --act:#c9a961;
  --pad:clamp(18px,3.2vw,64px);
  --wrap:min(1640px,100%);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --show:"ZCOOL XiaoWei","Noto Serif SC",serif;
  --latin:"Cinzel Decorative",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);scrollbar-color:#3a4250 transparent;
  transition:--theme 1s ease,--theme-deep 1s ease}
body{font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;min-height:100vh;
  background:
    radial-gradient(1100px 520px at 50% -120px,color-mix(in srgb,var(--theme-deep) 38%,transparent),transparent 70%),
    linear-gradient(180deg,var(--bg-up) 0,var(--bg) 560px)}
/* 星空：随机散星 + 随机浮现的黄道星座，画在 canvas 上 */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* 星座单独一层，压在封面背景之上；封面亮起时整层慢慢淡出 */
#zodiac{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1.4s ease}
body.amb-on #zodiac,body.open #zodiac{opacity:0}
/* 悬浮卡片时的封面背景：两层轮换做交叉淡入，慢慢放大 */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;inset:-6%;background-size:cover;background-position:center 30%;opacity:0;
  filter:blur(5px) saturate(1.1) brightness(.5);transition:opacity 1.1s ease;will-change:opacity,transform}
.amb i.on{opacity:.9}
.amb i.kb{animation:drift 16s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.18) translateY(-1.5%)}}
/* 压暗四周和底部，卡和文字始终压得住背景 */
.amb::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 30%,rgba(6,7,10,.75) 100%),linear-gradient(180deg,rgba(6,7,10,.2),rgba(6,7,10,.55))}
/* 进详情页时不直接关掉：悬浮的封面背景留着，和详情页的模糊封面交叉淡入 */
.amb{transition:opacity .6s ease}
body.open .amb{opacity:0;transition:opacity .9s ease .1s}
body.open.closing .amb{opacity:1;transition:opacity .6s ease}
/* 极淡的颗粒，压掉纯色的数码感 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--act);outline-offset:4px}
.home,.detail{position:relative;z-index:1}

/* ── 标题 ── */
.masthead{position:relative;text-align:center;padding:clamp(36px,6vh,72px) var(--pad) clamp(22px,3.4vh,38px)}
.title h1{font-family:var(--serif);font-weight:900;font-size:clamp(56px,7.2vw,128px);line-height:1;
  /* letter-spacing 会在末字后多留一格，padding-left 补回来才真居中 */
  letter-spacing:.16em;padding-left:.16em;
  background:linear-gradient(180deg,#fff 0%,#e3e7ec 38%,#9aa2ad 72%,#d6dbe1 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(220,230,245,.28)) drop-shadow(0 4px 0 rgba(0,0,0,.55))}
.title .latin{font-family:"UnifrakturMaguntia",serif;font-size:clamp(20px,2.3vw,40px);color:#dfe3e8;
  margin-top:clamp(8px,1.2vh,16px);letter-spacing:.05em;
  text-shadow:0 0 8px color-mix(in srgb,var(--theme-deep) 95%,transparent),0 0 22px color-mix(in srgb,var(--theme-deep) 55%,transparent)}
.title .latin span{color:var(--theme)}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:clamp(14px,2vh,22px);color:#8d96a3}
.orn i{display:block;height:1px;width:clamp(60px,10vw,180px);background:linear-gradient(90deg,transparent,rgba(233,237,242,.45))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{font-family:var(--latin);font-size:11px;letter-spacing:.42em;padding-left:.42em;font-weight:700;color:#9aa3af}

/* ── 分类条 ── */
.bar{position:sticky;top:0;z-index:20;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--theme-deep) 14%,rgba(10,12,17,.6));backdrop-filter:blur(10px) saturate(1.2)}
.bar-in{width:var(--wrap);margin:0 auto;padding:0 var(--pad);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:64px}
.tally{display:flex;align-items:baseline;gap:8px;color:var(--dim)}
.tally .ab{font-family:var(--latin);font-weight:700;font-size:10px;letter-spacing:.32em;color:#8d96a3;align-self:flex-start;margin-top:4px}
.tally b{font-family:var(--latin);font-weight:700;font-size:24px;letter-spacing:.06em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#9aa2ad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px color-mix(in srgb,var(--theme) 45%,transparent))}

/* 切换分类：旧卡淡出下沉，新卡依次浮上来 */
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.cats{position:relative;display:flex;gap:clamp(22px,3.6vw,64px)}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 12px;color:#8f99a7;transition:color .35s}
.cat .zh{font-family:var(--show);font-size:clamp(17px,1.25vw,21px);letter-spacing:.24em;padding-left:.24em;line-height:1}
.cat .en{font-family:var(--latin);font-weight:700;font-size:9px;letter-spacing:.3em;padding-left:.3em;opacity:.55;transition:opacity .35s}
.cat:hover{color:#cdd4dd}
.cat[aria-pressed="true"]{color:var(--silver)}
.cat[aria-pressed="true"] .zh{background:linear-gradient(180deg,#fff,#aeb6c1);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(233,237,242,.35))}
.cat[aria-pressed="true"] .en{opacity:.85}
/* 一根共用的指示线：切换分类时滑过去，菱形顺手转半圈 */
.ind{position:absolute;left:0;bottom:-1px;height:1px;width:var(--w,0);transform:translateX(var(--x,0));pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(233,237,242,.7),transparent);
  transition:transform .6s cubic-bezier(.65,0,.25,1),width .6s cubic-bezier(.65,0,.25,1)}
.ind::after{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;transform:translate(-50%,-50%) rotate(var(--rot,45deg));
  background:var(--silver);box-shadow:0 0 10px var(--theme);transition:transform .6s cubic-bezier(.65,0,.25,1)}
.ind.cold{transition:none}.ind.cold::after{transition:none}
.tools{justify-self:end;display:flex;align-items:center;gap:10px}
.find{width:38px;height:38px;display:grid;place-items:center;color:var(--dim);transition:color .2s}
.find:hover{color:var(--silver)}

/* 收录按钮：细银框 + 四角折线，像展柜的标牌 */
.import{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 18px 0 14px;color:#e4e8ed;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01));border:1px solid rgba(233,237,242,.22);
  transition:border-color .3s,box-shadow .3s,background .3s}
.import::before,.import::after{content:"";position:absolute;width:7px;height:7px;border:1px solid var(--silver);opacity:.7;transition:all .3s}
.import::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
.import::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.import:hover{border-color:color-mix(in srgb,var(--theme) 75%,transparent);box-shadow:0 0 22px -2px color-mix(in srgb,var(--theme) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--theme) 15%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--theme) 14%,transparent),color-mix(in srgb,var(--theme) 2%,transparent))}
.import:hover::before{left:-7px;top:-7px}.import:hover::after{right:-7px;bottom:-7px}
/* 菱形和十字画在同一个 SVG 里，用字符 "+" 会因字体基线偏上偏粗 */
.import .seal{width:24px;height:24px;display:block;overflow:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.import:hover .seal{transform:rotate(90deg)}
.seal .rim{stroke:currentColor;stroke-width:1;opacity:.85}
.seal .cross{stroke:currentColor;stroke-width:1.1;stroke-linecap:round}
.seal .dot{fill:var(--theme);opacity:0;transition:opacity .3s}
.import:hover .seal .dot{opacity:1}
.import .zh{font-family:var(--show);font-size:17px;letter-spacing:.3em;padding-left:.1em}

/* ── 卡库 ── */
.shelf{width:var(--wrap);margin:0 auto;padding:clamp(30px,4.5vh,56px) var(--pad) 110px;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  column-gap:clamp(20px,2.6vw,52px);row-gap:clamp(30px,4.2vw,68px);
  transition:opacity .22s ease,transform .22s ease}
.shelf.out{opacity:0;transform:translateY(10px)}
.shelf.enter .cell{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*30ms)}
.cell{display:block;text-align:center;width:100%}
.cell:focus-visible{outline:none}
.cell .nm{display:block;margin-top:clamp(12px,1.1vw,18px);font-family:var(--show);font-size:clamp(15px,1.12vw,20px);
  letter-spacing:.14em;padding-left:.14em;color:#a9b2be;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s,text-shadow .3s}
.cell:hover .nm,.cell:focus-visible .nm{color:var(--silver);text-shadow:0 0 14px color-mix(in srgb,var(--theme) 70%,transparent)}

/* 3D 卡：.tilt 提供透视，.card 跟鼠标转。overflow:hidden 会压平 3D，所以只放在 .art 上 */
.tilt{perspective:1000px;container-type:inline-size}
.card{--rx:0;--ry:0;--s:1;--gx:50%;--gy:50%;--ga:0;position:relative;aspect-ratio:2/3;transform-style:preserve-3d;
  transform:rotateX(calc(var(--rx)*1deg)) rotateY(calc(var(--ry)*1deg)) scale(var(--s));
  transition:transform .75s cubic-bezier(.18,.9,.22,1);will-change:transform}
.card.live{transition:transform .12s ease-out}
.art{position:absolute;inset:0;overflow:hidden;border-radius:3px;background:#0c0f14;
  box-shadow:calc(var(--ry)*-1.1px) calc(var(--rx)*1.1px + 14px) 26px -10px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.04);
  transition:box-shadow .75s cubic-bezier(.18,.9,.22,1)}
.card.live .art{transition:box-shadow .12s ease-out}
.art img{width:100%;height:100%;object-fit:cover;display:block;
  /* 封面在框里反向平移，像隔着一层玻璃看到后面的画，比反光更有纵深 */
  transform:scale(calc(1 + var(--ga)*.07)) translate(calc(var(--ry)*-.25%),calc(var(--rx)*.25%));
  transition:transform .75s cubic-bezier(.18,.9,.22,1),filter .4s}
.card.live .art img{transition:transform .12s ease-out,filter .4s}
.cell:hover .art img{filter:brightness(1.07) saturate(1.06)}
.cell:hover .art{box-shadow:calc(var(--ry)*-1.1px) calc(var(--rx)*1.1px + 14px) 26px -10px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.04),
  0 0 42px -12px var(--theme)}
/* 边缘光：只亮离鼠标最近的那段边，颜色取自这张封面 */
.rim{position:absolute;inset:0;border-radius:3px;padding:1.5px;pointer-events:none;opacity:var(--ga);transition:opacity .5s;
  background:radial-gradient(circle at var(--gx) var(--gy),var(--theme) 0%,color-mix(in srgb,var(--theme) 45%,transparent) 22%,transparent 52%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card .frame{position:absolute;inset:5.5%;border:1px solid rgba(240,243,247,.55);pointer-events:none;
  opacity:0;transform:translateZ(18px);transition:opacity .45s}
.card .no{position:absolute;left:8%;top:5%;font-family:var(--latin);font-weight:700;font-size:6.4cqw;letter-spacing:.12em;color:#f2f4f7;
  text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;transform:translateZ(34px);transition:opacity .45s;pointer-events:none}
.cover-title{position:absolute;left:8%;right:8%;line-height:1.05;pointer-events:none;transform:translateZ(48px)}
.cover-title.v{writing-mode:vertical-rl;left:auto;right:9%;top:7%}
.cell:hover .frame,.cell:focus-visible .frame{opacity:.7}
.cell:hover .no,.cell:focus-visible .no{opacity:.9}
.cell:focus-visible .card{--s:1.03}

/* ── 收录弹窗 / 拖入遮罩 ── */
dialog.gate{margin:auto;border:0;padding:0;background:transparent;color:var(--text);max-width:min(860px,92vw);width:100%}
dialog.gate::backdrop{background:radial-gradient(circle at 50% 40%,rgba(18,12,32,.72),rgba(5,6,9,.92));backdrop-filter:blur(6px)}
.gate-in{position:relative;display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:clamp(24px,4vw,56px);align-items:center;
  padding:clamp(26px,4vw,52px);background:linear-gradient(180deg,rgba(32,37,47,.96),rgba(18,21,28,.96));border:1px solid rgba(233,237,242,.14);
  box-shadow:0 40px 80px -20px rgba(0,0,0,.8)}
.gate-in::before{content:"";position:absolute;inset:8px;border:1px solid rgba(233,237,242,.06);pointer-events:none}
.slot .art{display:grid;place-items:center;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 8px,transparent 8px 16px),#10141a;
  outline:1px dashed rgba(233,237,242,.32);outline-offset:-10px}
.slot .sigil{position:absolute;inset:0;display:grid;place-items:center;transform:translateZ(40px);pointer-events:none}
.slot .sigil .seal{width:46%;height:auto;color:var(--silver);overflow:visible;
  filter:drop-shadow(0 0 8px rgba(166,140,255,.75)) drop-shadow(0 0 18px rgba(166,140,255,.35))}
.slot .sigil .rim{stroke-width:.6}
.slot .sigil .cross{stroke-width:.7}
.slot .sigil .dot{opacity:1}
.gate h3{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:clamp(28px,3vw,42px);color:#e6e9ee;
  text-shadow:0 0 10px rgba(75,51,145,.9),0 0 26px rgba(75,51,145,.5)}
.gate .sub{font-family:var(--show);font-size:clamp(17px,1.4vw,20px);letter-spacing:.2em;color:#c7ced8;margin-top:10px}
.gate .fmt{font-family:var(--latin);font-weight:700;font-size:10px;letter-spacing:.38em;color:var(--dim);margin-top:18px}
.gate .ways{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.way{font-family:var(--show);font-size:17px;letter-spacing:.2em;padding:12px 26px;border:1px solid rgba(233,237,242,.25);color:#e4e8ed;transition:all .3s}
.way.main{background:linear-gradient(180deg,#e9edf2,#a9b1bc);color:#151920;border-color:transparent}
.way:hover{border-color:rgba(166,140,255,.8);box-shadow:0 0 20px -2px rgba(166,140,255,.5)}
.way.main:hover{filter:brightness(1.08)}
.gate .hint{margin-top:22px;font-size:13px;color:var(--dim)}
.gate .x{position:absolute;right:14px;top:12px;width:34px;height:34px;color:var(--dim);font-size:22px}
.gate .x:hover{color:var(--silver)}

.drop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at 50% 45%,rgba(34,22,64,.7),rgba(5,6,9,.92))}
.drop.on{opacity:1}
.drop-box{width:min(320px,52vw);text-align:center}
.drop .slot{width:62%;margin:0 auto 26px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

.toast{position:fixed;left:50%;bottom:34px;z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:12px 26px;font-family:var(--show);letter-spacing:.14em;color:var(--silver);background:rgba(20,24,31,.92);
  border:1px solid rgba(233,237,242,.2);transition:all .35s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 详情 ── */
.detail{display:none}
body.open .home{display:none}
body.open .detail{display:block}
.hero{position:relative;min-height:clamp(420px,56vh,620px);overflow:hidden}
.hero-bg{position:absolute;inset:-60px;background-size:cover;background-position:center 30%;filter:blur(38px) saturate(1.1) brightness(.5);transform:scale(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,19,.2) 0%,rgba(11,13,19,.65) 60%,var(--bg) 100%)}
.hero-wrap{position:relative;z-index:1;width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.back{margin-top:22px;width:48px;height:48px;display:grid;place-items:center;color:var(--silver);opacity:.72;
  transition:opacity .3s,transform .3s,filter .3s}
.back svg{width:34px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
.back:hover{opacity:1;transform:translateX(-4px);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--theme) 70%,transparent))}
.hero-in{display:grid;grid-template-columns:clamp(200px,18vw,300px) minmax(0,40em);justify-content:center;gap:clamp(28px,4vw,64px);align-items:end;padding:12px 0 36px}
.hero h2{font-family:var(--show);font-weight:400;font-size:clamp(40px,4.6vw,76px);color:var(--silver);line-height:1.15;letter-spacing:.06em;
  text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero .meta{margin-top:12px;font-size:14px;color:var(--text);opacity:.85}
.hero .desc{margin-top:18px;max-width:38em;font-family:var(--serif);font-size:16px;line-height:1.95;color:var(--text)}
.actions{display:flex;align-items:center;gap:22px;margin-top:28px}
.grade{display:flex;align-items:baseline;gap:8px}
.grade b{font-family:var(--latin);font-size:32px;color:var(--silver)}
.grade span{font-size:12px;color:var(--dim)}
.tabs-wrap{position:relative;border-bottom:1px solid var(--line)}
.tabs{width:var(--wrap);margin:0 auto;padding:0 var(--pad);display:flex;justify-content:center;flex-wrap:wrap;gap:0 clamp(22px,3vw,44px)}
.tabs button{padding:15px 0;font-family:var(--show);font-size:17px;letter-spacing:.16em;color:var(--dim);border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .35s}
.tabs button:hover{color:#cdd4dd}
.tabs button[aria-selected="true"]{color:var(--silver)}
/* 标签栏的指示线：和首页分类条同一套，滑到新标签，菱形转半圈 */
.tind{position:absolute;left:0;top:0;height:1px;width:var(--w,0);transform:translate(var(--x,0),calc(var(--y,0px) - 1px));pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--theme),transparent);
  transition:transform .55s cubic-bezier(.65,0,.25,1),width .55s cubic-bezier(.65,0,.25,1)}
.tind::after{content:"";position:absolute;left:50%;top:0;width:6px;height:6px;transform:translate(-50%,-50%) rotate(var(--rot,45deg));
  background:var(--silver);box-shadow:0 0 10px var(--theme);transition:transform .55s cubic-bezier(.65,0,.25,1)}
.tind.cold,.tind.cold::after{transition:none}
/* 切标签：旧内容往反方向淡出，新内容从标签移动的方向依次浮上来 */
.pane{transition:opacity .2s ease,transform .2s ease}
.pane.out{opacity:0;transform:translateX(calc(var(--dx,0px) * -1))}
.pane.swap{transition:none}
.pane.swap>*{animation:panein .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*55ms)}
@keyframes panein{from{opacity:0;transform:translate(var(--dx,0px),14px)}}
.tabs small{margin-left:6px;font-family:var(--latin);font-size:11px;opacity:.7;letter-spacing:0}
.pane{width:var(--wrap);margin:0 auto;padding:34px var(--pad) 100px}
.pane>*{max-width:900px;margin-left:auto;margin-right:auto}
.pane .empty{text-align:center;color:var(--dim)}
.passage{font-family:var(--serif);font-size:17px;line-height:2.1;white-space:pre-wrap;max-width:36em;color:#dfe5ec}
.turn{display:flex;justify-content:center;gap:22px;margin-top:28px;font-size:13px;color:var(--dim)}
.turn button{color:var(--act)}
.rows{list-style:none;background:var(--panel);border:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:1fr auto;gap:4px 18px;padding:14px 18px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows b{font-weight:500;color:#e2e8ef}
.rows .k{font-size:13px;color:var(--dim)}
.rows .s{grid-row:1;grid-column:2;font-size:12px;color:var(--dim)}
.rows .off{opacity:.45}
.try{margin-top:26px}
.try label{display:block;font-size:13px;color:var(--dim);margin-bottom:8px}
.try textarea{width:100%;min-height:80px;padding:12px;font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);resize:vertical}
pre{background:var(--panel);border:1px solid var(--line);padding:18px;font-size:13px;line-height:1.7;overflow:auto;font-family:Consolas,"Cascadia Mono",monospace;color:#cfd8e3}
.big{font-family:var(--latin);font-size:80px;color:var(--silver);line-height:1}
.big+p{margin-top:14px;color:var(--dim);font-size:14px}
.rows li{cursor:pointer}
.rows .t{grid-column:1/-1;display:none;margin-top:8px;font-family:var(--serif);font-size:14.5px;line-height:1.9;color:#cfd7e1;white-space:pre-wrap}
.rows li.open .t{display:block}

/* 编辑：每个标签页上方一条工具栏，点“编辑”后原地变成输入框 */
.pbar{display:flex;justify-content:center;gap:14px;margin-bottom:30px}
.tool{display:inline-flex;align-items:center;gap:8px;padding:8px 22px;font-family:var(--show);font-size:15px;letter-spacing:.2em;color:var(--text);
  border:1px solid var(--line);transition:border-color .3s,color .3s,box-shadow .3s}
.tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5}
.tool:hover{color:var(--silver);border-color:color-mix(in srgb,var(--theme) 60%,transparent);box-shadow:0 0 18px -6px var(--theme)}
.tool.main{background:linear-gradient(180deg,#e9edf2,#a9b1bc);color:#151920;border-color:transparent}
.in{display:block;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:14.5px;line-height:1.8;padding:9px 12px;resize:vertical}
.in:focus{outline:none;border-color:color-mix(in srgb,var(--theme) 55%,transparent)}
textarea.big-in{min-height:340px;font-family:var(--serif);font-size:16px;line-height:2}
.add{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;margin-top:14px;padding:14px;border:1px dashed var(--line);
  color:var(--dim);font-family:var(--show);font-size:15px;letter-spacing:.2em;transition:color .3s,border-color .3s}
.add svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.2;transition:transform .4s}
.add:hover{color:var(--silver);border-color:color-mix(in srgb,var(--theme) 55%,transparent)}
.add:hover svg{transform:rotate(90deg)}
.erow{display:grid;grid-template-columns:1fr 1fr auto auto;align-items:center;gap:10px;padding:14px;margin-top:10px;background:var(--panel);border:1px solid var(--line)}
.erow .full{grid-column:1/-1}
.sw input{display:none}
.sw i{display:block;width:34px;height:18px;border:1px solid var(--line);border-radius:9px;position:relative;cursor:pointer}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:left .25s,background .25s}
.sw input:checked+i::after{left:18px;background:var(--theme)}
.del{width:30px;height:30px;display:grid;place-items:center;color:var(--dim)}
.del svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.del:hover{color:#e9a3a3}
.fields{display:grid;gap:30px}
.fields dt{text-align:center;font-family:var(--show);font-size:15px;letter-spacing:.3em;color:var(--dim);margin-bottom:12px}
.fields dd{font-family:var(--serif);font-size:16px;line-height:2;color:#dfe5ec;white-space:pre-wrap;text-align:center}
.fields dd .in{text-align:left}

/* 世界书：按插入位置分组，组内按优先级（order）从小到大排 */
.wbsum{display:flex;justify-content:center;gap:26px;margin-bottom:34px;font-size:13px;color:var(--dim);letter-spacing:.08em}
.wbsum b{font-family:var(--latin);font-weight:400;font-size:18px;color:var(--silver);margin-right:6px}
.wbgrp{display:flex;align-items:center;gap:16px;margin:36px auto 14px;font-family:var(--show);font-weight:400;font-size:15px;letter-spacing:.3em;color:var(--dim)}
.wbgrp:first-of-type{margin-top:0}
.wbgrp::before,.wbgrp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.wbgrp::after{background:linear-gradient(90deg,var(--line),transparent)}
.wbgrp small{font-family:var(--latin);font-size:11px;letter-spacing:.1em;opacity:.7}
.lore{list-style:none;display:grid;gap:8px}
.lore li{padding:14px 20px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .3s}
.lore li:hover{border-color:color-mix(in srgb,var(--theme) 40%,transparent)}
.lore li.off{opacity:.45}
.lh{display:flex;align-items:center;gap:14px}
.lamp{flex:none;width:9px;height:9px;transform:rotate(45deg)}
.lamp.c{background:#6ea8ff;box-shadow:0 0 8px #6ea8ff}
.lamp.s{background:#6fd49a;box-shadow:0 0 8px #6fd49a}
.lh b{font-weight:500;color:#e2e8ef}
.lh .tk{font-family:var(--latin);font-size:12px;color:var(--dim)}
.lh .sp{flex:1}
.lh .tg{font-size:12px;color:var(--text);letter-spacing:.06em;padding:2px 10px;border:1px solid var(--line)}
.lh .tg em{font-style:normal;font-family:var(--latin);color:var(--silver);margin-left:6px}
.kw{margin:8px 0 0 23px;font-size:13px;color:var(--dim)}
.kw span+span::before{content:"·";margin:0 8px;opacity:.6}
.lb{display:none;margin:12px 0 0 23px;padding-top:12px;border-top:1px solid var(--line)}
.lore li.open .lb{display:block}
.lb p{font-family:var(--serif);font-size:14.5px;line-height:1.9;color:#cfd7e1;white-space:pre-wrap}
.flags{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--dim)}
.flags span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;transform:rotate(45deg);border:1px solid currentColor;vertical-align:1px}
.flags span.on{color:var(--theme)}
.flags span.on::before{background:currentColor}
.erow.lw{grid-template-columns:repeat(4,1fr) auto}
.ef{display:grid;gap:5px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.ef.w2{grid-column:span 2}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.ck input{accent-color:var(--theme)}
.erow .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.stat{display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--latin);font-size:32px;color:var(--silver)}
.stat span{font-family:var(--latin);font-size:11px;letter-spacing:.2em;color:var(--dim)}
.actions .dia{width:6px;height:6px;transform:rotate(45deg);background:var(--theme);opacity:.7}
.sname{text-align:center;font-family:var(--show);letter-spacing:.2em;color:var(--dim);margin:0 auto 10px}

/* 世界书、正则：点开条目原地就能改，改过才出现保存、取消 */
.lore li.open{border-color:color-mix(in srgb,var(--theme) 45%,transparent)}
.lore li.off.open{opacity:1}
.lore.rx .lb{margin-left:0}
.lh .nn{color:var(--dim);font-weight:400}
.lh .uns{display:none;font-size:12px;color:var(--theme);letter-spacing:.1em}
.lore li.dirty:not(.open) .uns{display:inline}
.bin{display:none;align-items:center;gap:6px;height:28px;padding:0 4px;color:var(--dim);font-size:12px;letter-spacing:.1em;transition:color .25s}
.lore li.open .bin{display:inline-flex}
.bin svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bin span{display:none}
.bin:hover,.bin.armed{color:#e9a3a3}
.bin.armed span{display:inline}
.lf{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;cursor:auto}
.lf .w3{grid-column:span 3}
.lf .full{grid-column:1/-1}
.lf .row{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding-top:18px}
.lt{font-family:var(--serif);font-size:15px;line-height:1.9}
.acts{display:none;justify-content:flex-end;gap:10px;margin-top:14px}
.lore li.dirty .acts{display:flex}
.tool.sm{padding:6px 18px;font-size:14px}
@media (max-width:760px){.lf{grid-template-columns:1fr 1fr}.lf .w3{grid-column:1/-1}}

/* 点评：总分 → 女仆总评 → 八项细分 */
.verdict{text-align:center}
.verdict .by{margin-top:10px;font-size:13px;color:var(--dim);letter-spacing:.1em}
.verdict .in{width:140px;margin:0 auto;text-align:center;font-family:var(--latin);font-size:40px;line-height:1.2}
.review{margin-top:36px;max-width:34em;padding:28px 34px;font-family:var(--serif);font-size:16.5px;line-height:2.1;color:#dfe5ec;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.review::before,.review::after{content:"";position:absolute;left:50%;width:7px;height:7px;background:var(--theme);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 10px var(--theme)}
.review::before{top:-4px}.review::after{bottom:-4px}
.items{list-style:none;margin-top:38px;max-width:620px;display:grid;gap:14px}
.items li{display:grid;grid-template-columns:7em 1fr 2.6em;align-items:center;gap:16px;font-size:14px}
.items span{font-family:var(--show);letter-spacing:.12em;color:var(--text);text-align:right}
.items i{height:2px;background:var(--line);position:relative}
.items i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:linear-gradient(90deg,var(--theme-deep),var(--theme))}
.items b{font-family:var(--latin);font-weight:400;color:var(--silver)}

/* ── 进出详情页的衔接 ──
   封面从卡库的位置飞到详情页的位置（.fly 是飞行中的替身），
   卡库向外淡出，详情页的模糊背景淡入，文字随后一行行浮起。返回时倒着来。 */
.fly{position:fixed;z-index:20;pointer-events:none;transform-origin:0 0}
.fly .frame,.fly .no{opacity:0}
.fly.hot .frame{opacity:.7}
.fly.hot .no{opacity:.9}
.fly.hot .art{box-shadow:0 14px 26px -10px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.04),0 0 42px -12px var(--theme)}
.fly.hot .art img{filter:brightness(1.07) saturate(1.06)}
body.open.opening .home,body.open.closing .home{display:block;position:fixed;top:var(--hy,0);left:0;right:0;pointer-events:none;
  transform-origin:var(--ox,50%) var(--oy,50%)}
body.opening .home{z-index:2;animation:homeout .55s cubic-bezier(.4,0,.6,1) forwards}
body.closing .home{animation:homein .6s cubic-bezier(.2,.7,.2,1) .15s backwards}
body.closing .detail{z-index:2;opacity:0;transition:opacity .3s ease;pointer-events:none}
@keyframes homeout{to{opacity:0;transform:scale(1.05)}}
@keyframes homein{from{opacity:0;transform:scale(1.05)}}
.detail.enter .hero-bg{animation:bgin 1.5s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes bgin{from{opacity:0;transform:scale(1.32)}}
.detail.enter .rise{animation:lift .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d)*1ms)}
.detail.enter h2.rise{animation-name:liftb;animation-duration:1s}
@keyframes lift{from{opacity:0;transform:translateY(16px)}}
@keyframes liftb{from{opacity:0;transform:translateY(16px);filter:blur(8px);letter-spacing:.16em}}

.note{position:fixed;right:14px;bottom:10px;z-index:2;font-size:12px;color:var(--dim);opacity:.6}

/* ── 分辨率适配 ── */
@media (max-width:1100px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:860px){
  .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar-in{grid-template-columns:1fr auto;grid-template-areas:"cats cats" "tally tools";row-gap:4px;padding-top:4px;padding-bottom:8px}
  .cats{grid-area:cats;justify-self:center}.tally{grid-area:tally}.tools{grid-area:tools}
  .gate-in{grid-template-columns:1fr;text-align:center}
  .gate-in .slot{width:150px;margin:0 auto}
  .gate .ways{justify-content:center}
}
@media (max-width:560px){
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cat .en{display:none}
  .hero-in{grid-template-columns:1fr}
  .hero-in .tilt{width:200px}
}
@media (min-width:2200px){:root{--wrap:min(2000px,100%)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* 鼠标相对卡中心的位置 → 倾斜角 + 反光位置。只在有鼠标且没开“减少动态”时启用 */
const CAN_TILT=matchMedia('(hover:hover) and (pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
const MAX=12;
function bindTilt(root){
  if(!CAN_TILT)return;
  root.querySelectorAll('.tilt').forEach(el=>{
    const card=el.querySelector('.card');let raf=0;
    el.addEventListener('pointerenter',()=>{card.classList.add('live');card.style.setProperty('--s',1.045);card.style.setProperty('--ga',1)});
    el.addEventListener('pointermove',e=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
        card.style.setProperty('--rx',((.5-y)*2*MAX).toFixed(2));
        card.style.setProperty('--ry',((x-.5)*2*MAX).toFixed(2));
        card.style.setProperty('--gx',(x*100).toFixed(1)+'%');
        card.style.setProperty('--gy',(y*100).toFixed(1)+'%');
      });
    });
    el.addEventListener('pointerleave',()=>{
      cancelAnimationFrame(raf);card.classList.remove('live');
      for(const[k,v]of[['--rx',0],['--ry',0],['--s',1],['--ga',0],['--gx','50%'],['--gy','50%']])card.style.setProperty(k,v);
    });
  });
}

function makeFly(c,i,r,srcCard){
  const f=document.createElement('div');f.className='fly';
  f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px`;
  f.innerHTML=cardHTML(c,i);

  if(srcCard){const cd=f.querySelector('.card');cd.style.cssText=srcCard.style.cssText;requestAnimationFrame(()=>requestAnimationFrame(()=>{cd.style.cssText=''}))}
  document.body.appendChild(f);return f;
}
function flyTo(f,a,b,ms){
  const k=b.width/a.width;
  return f.animate([{transform:'none'},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${k})`}],
    {duration:ms,easing:'cubic-bezier(.22,.8,.2,1)',fill:'forwards'}).finished;
}

    if(!live.every(l=>Math.hypot(l.x-x,l.y-(y+sy))>(l.sz+sz)*.5))continue;
    const cs=Math.cos(rot),sn=Math.sin(rot);
    const pts=z[1].map(([px,py,b])=>{const dx=(px-.5)*sz,dy=(py-.5)*sz;return[x+dx*cs-dy*sn,y+dx*sn+dy*cs,b]});
    const seen=pts.filter(p=>!hidden(p[0],p[1],R)).length/pts.length;
    const off=Math.hypot((x-W/2)/W,(y-H*.42)/H);
    const score=seen-off*.8;
    if(seen>=.7&&score>bs){bs=score;best={x,y,sz,pts}}
  }
  if(!best){bag.unshift(z);return}
  /* 存成页面坐标，星座跟着页面一起滚动，和卡的相对位置不变 */
  live.push({z,x:best.x,y:best.y+sy,sz:best.sz,pts:best.pts.map(([x,y,b])=>[x,y+sy,b]),t0:t,hold:rnd(14000,22000)});
}

function drawCon(l,t){
  const ctx=zx;
  const e=t-l.t0,end=DRAW_AT+DRAW_LEN+l.hold,f=e>end?1-(e-end)/OUT:1;
  if(f<=0)return false;
  const sIn=clamp(e/IN),edges=l.z[2],prog=clamp((e-DRAW_AT)/DRAW_LEN)*edges.length;
  ctx.lineWidth=.8;ctx.strokeStyle=`rgba(196,210,232,${(.32*f).toFixed(3)})`;ctx.beginPath();
  edges.forEach(([a,b],j)=>{const s=clamp(prog-j);if(!s)return;const A=l.pts[a],B=l.pts[b];
    ctx.moveTo(A[0],A[1]);ctx.lineTo(A[0]+(B[0]-A[0])*s,A[1]+(B[1]-A[1])*s)});
  ctx.stroke();
  for(const[x,y,b]of l.pts){
    const a=(.4+.55*b)*sIn*f,r=.8+b*1.5;
    const g=ctx.createRadialGradient(x,y,0,x,y,r*5);
    g.addColorStop(0,`rgba(220,230,250,${(a*.35).toFixed(3)})`);g.addColorStop(1,'rgba(220,230,250,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*5,0,6.2832);ctx.fill();
    ctx.fillStyle=`rgba(244,247,252,${a.toFixed(3)})`;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  }
  const la=.4*clamp((e-LABEL_AT)/2500)*f;
  if(la>0){
    let bx=0,by=-1e9;for(const p of l.pts){bx+=p[0];if(p[1]>by)by=p[1]}
    ctx.font='700 10px "Cinzel Decorative",serif';ctx.textAlign='center';ctx.letterSpacing='4px';
    ctx.fillStyle=`rgba(200,212,230,${la.toFixed(3)})`;ctx.fillText(l.z[0],bx/l.pts.length,by+22);
  }
  return true;
}

function frame(t){
  if(!STILL)requestAnimationFrame(frame);
  if(t-last<33)return;
  const dt=t-last;last=t;  /* 约 30 帧就够星星闪，省一半开销 */
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    const a=s.a*(STILL?1:.7+.3*Math.sin(t*.001*s.s+s.p));
    if(s.r>1.1){ctx.fillStyle=`rgba(${s.c},${(a*.12).toFixed(3)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.5,0,6.2832);ctx.fill()}
    ctx.fillStyle=`rgba(${s.c},${a.toFixed(3)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.2832);ctx.fill();
  }
  /* 封面背景亮着时，星座整层淡出（CSS），各自的时钟也停住，回来时接着放 */
  if(document.body.classList.contains('amb-on')&&dt<1000)for(const l of live)l.t0+=dt;
  if(!STILL&&t>=nextAt){spawn(t);nextAt=t+rnd(6000,11000)}
  zx.clearRect(0,0,W,H);zx.save();zx.translate(0,-scrollY);
  live=live.filter(l=>drawCon(l,t));
  zx.restore();
}

function start(){
  build();
  if(STILL){for(let i=0;i<MAXLIVE;i++)spawn(0);live.forEach(l=>{l.t0=-3e4;l.hold=1e12});last=-1e9;frame(0);return}
  nextAt=performance.now()+800;
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(start,200)});
/* 字体加载后标题和卡名会变宽，挡住的区域跟着变，重新开始 */
document.fonts.ready.then(start);
start();if(!STILL)requestAnimationFrame(frame);
})();
</script>
</body>
